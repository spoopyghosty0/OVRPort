name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel (experimental includes the opt-in VrApi adapter)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - experimental

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve version and channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      experimental: ${{ steps.release.outputs.experimental }}
      is_release: ${{ steps.release.outputs.is_release }}
      artifact_suffix: ${{ steps.release.outputs.artifact_suffix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: release
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          declared_version="$(sed -n 's/^appVersion=//p' gradle.properties)"
          version="$declared_version"
          channel="$REQUESTED_CHANNEL"
          is_release=false

          if [[ ! "$declared_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "appVersion must be a numeric major.minor.patch version." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
              echo "Release tags must match v<major>.<minor>.<patch>[-prerelease]." >&2
              exit 1
            fi
            tag_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            prerelease="${BASH_REMATCH[4]}"
            if [[ "$tag_version" != "$declared_version" ]]; then
              echo "Tag version $tag_version does not match appVersion $declared_version." >&2
              exit 1
            fi
            version="$tag_version"
            is_release=true
            if [[ -n "$prerelease" ]]; then
              channel=experimental
            else
              channel=stable
            fi
          fi

          if [[ "$channel" != "stable" && "$channel" != "experimental" ]]; then
            echo "Unknown build channel: $channel" >&2
            exit 1
          fi

          experimental=false
          if [[ "$channel" == "experimental" ]]; then
            experimental=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "experimental=$experimental" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$version-$channel" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform compatibility toolchain
        run: sdkmanager 'ndk;27.3.13750724'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run test suite
        run: ./gradlew :overportcli:test -PappVersion=${{ needs.metadata.outputs.version }}

  vrapi-payload:
    name: Build experimental VrApi adapter
    needs: [metadata, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: needs.metadata.outputs.experimental == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.metadata.outputs.experimental == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        if: needs.metadata.outputs.experimental == 'true'
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        if: needs.metadata.outputs.experimental == 'true'
        shell: bash
        run: sdkmanager 'ndk;27.3.13750724'

      - name: Build adapter resource
        if: needs.metadata.outputs.experimental == 'true'
        shell: bash
        run: |
          python native/vrapi/build.py \
            --ndk "$ANDROID_SDK_ROOT/ndk/27.3.13750724" \
            --output "$RUNNER_TEMP/vrapi-resource"

      - name: Upload adapter for packaging job
        if: needs.metadata.outputs.experimental == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: internal-vrapi-${{ needs.metadata.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/vrapi-resource/
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI package
    needs: [metadata, test, vrapi-payload]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform compatibility toolchain
        run: sdkmanager 'ndk;27.3.13750724'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Download experimental adapter
        if: needs.metadata.outputs.experimental == 'true'
        uses: actions/download-artifact@v4
        with:
          name: internal-vrapi-${{ needs.metadata.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/vrapi-resource

      - name: Build stable CLI
        if: needs.metadata.outputs.experimental != 'true'
        run: >-
          ./gradlew :overportcli:shadowJar
          -PappVersion=${{ needs.metadata.outputs.version }}

      - name: Build experimental CLI
        if: needs.metadata.outputs.experimental == 'true'
        run: >-
          ./gradlew :overportcli:shadowJar
          -PappVersion=${{ needs.metadata.outputs.version }}
          -PwithVrApi=true
          -PvrApiResourceRoot="$RUNNER_TEMP/vrapi-resource"

      - name: Verify packaged channel resources
        shell: bash
        env:
          EXPERIMENTAL: ${{ needs.metadata.outputs.experimental }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          artifacts = list(Path("overportcli/build/libs").glob("*-all.jar"))
          if len(artifacts) != 1:
              raise SystemExit(f"Expected one CLI JAR, found {len(artifacts)} artifacts")
          artifact = artifacts[0]
          resources = (
              "vrapi/arm64-v8a/libvrapi.bin",
              "vrapi/licenses/OPENXR-SDK.txt",
              "vrapi/licenses/ANDROID-NDK.txt",
          )
          with ZipFile(artifact) as archive:
              if os.environ["EXPERIMENTAL"] == "true":
                  root = Path(os.environ["RUNNER_TEMP"]) / "vrapi-resource"
                  for resource in resources:
                      if archive.read(resource) != (root / resource).read_bytes():
                          raise SystemExit(f"{artifact}: mismatched {resource}")
              elif any(name.startswith("vrapi/") for name in archive.namelist()):
                  raise SystemExit(f"{artifact}: experimental resources leaked into stable")
          print(f"Verified channel resources: {artifact}")
          PY

      - name: Stage CLI artifact
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(overportcli/build/libs/*-all.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one CLI shadow JAR, found ${#jars[@]}." >&2
            exit 1
          fi
          mkdir -p dist
          cp "${jars[0]}" "dist/$REPOSITORY_NAME-$VERSION-$CHANNEL-cli.jar"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.artifact_suffix }}-cli
          path: dist/*-cli.jar
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft release
    if: needs.metadata.outputs.is_release == 'true'
    needs: [metadata, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.artifact_suffix }}-cli
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} != 1 )); then
            echo "Expected one release asset, found ${#assets[@]}." >&2
            exit 1
          fi

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.repository.name }} ${{ github.ref_name }} (${{ needs.metadata.outputs.channel }})
          draft: true
          prerelease: ${{ needs.metadata.outputs.experimental == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
